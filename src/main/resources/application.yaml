spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api-gateway
  data:
    redis:
      host: wallet-redis-d     # Phase-2 (Full Containerization)
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          # Automatically appends the secret token to EVERY outbound request to the internal service
          # Clean up duplicate CORS headers.
          default-filters:
            - AddRequestHeader=X-Gateway-Token, ${GATEWAY_INTERNAL_SECRET:default-edge-secret-string-123}
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            # Route 1: Auth Endpoints (Verify OTP, Login, etc.)
            - id: wallet-auth-route
              uri: ${WALLET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CustomLuaRateLimiterFilter
                  args:
                    keyPrefix: "rate_limit:auth:"
                    capacity: 3
                    replenishRate: 1
                - AuthenticationFilter
                - name: CircuitBreaker
                  args:
                    name: walletServiceCircuitBreaker
                    fallbackUri: forward:/fallback/walletService
            # Route 2: Payment Endpoints
            - id: wallet-payment-route
              uri: ${WALLET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: CustomLuaRateLimiterFilter
                  args:
                    keyPrefix: "rate_limit:payments:"
                    capacity: 3
                    replenishRate: 1
                - AuthenticationFilter
                - name: CircuitBreaker
                  args:
                    name: walletServiceCircuitBreaker
                    fallbackUri: forward:/fallback/walletService
            # Route 3. Wallet Core Subsystem
            - id: wallet-domain-route
              uri: ${WALLET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/wallets/**
              filters:
                - name: CustomLuaRateLimiterFilter
                  args:
                    keyPrefix: "rate_limit:wallets:"
                    capacity: 3
                    replenishRate: 1
                - AuthenticationFilter
                - name: CircuitBreaker
                  args:
                    name: walletServiceCircuitBreaker
                    fallbackUri: forward:/fallback/walletService
            # Route 4. Admin Messaging / Kafka Observability APIs
            - id: wallet-admin-messaging-route
              uri: ${WALLET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/messaging/**
              filters:
                - name: CustomLuaRateLimiterFilter
                  args:
                    keyPrefix: "rate_limit:admin_messaging:"
                    capacity: 10
                    replenishRate: 3
                - AuthenticationFilter
                - name: CircuitBreaker
                  args:
                    name: walletServiceCircuitBreaker
                    fallbackUri: forward:/fallback/walletService
            # Admin Routes
            - id: wallet-admin-users-route
              uri: ${WALLET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/users/**
              filters:
                - name: CustomLuaRateLimiterFilter
                  args:
                    keyPrefix: "rate_limit:admin_users:"
                    capacity: 20
                    replenishRate: 5
                - AuthenticationFilter
                - name: CircuitBreaker
                  args:
                    name: walletServiceCircuitBreaker
                    fallbackUri: forward:/fallback/walletService
            # Route 5. Webhook Ingestion (Bypass Rate Limiter)
            - id: wallet-webhook-route
              uri: ${WALLET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/webhooks/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: walletServiceCircuitBreaker
                    fallbackUri: forward:/fallback/walletService
            # Route 6. The OpenAPI Data Pipeline
            - id: wallet-openapi-route
              uri: ${WALLET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/wallet-service/v3/api-docs/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: walletServiceCircuitBreaker
                    fallbackUri: forward:/fallback/walletService
                # Strips the /wallet-service/ namespace before forwarding to 8081
                - StripPrefix=1
springdoc:
#  api-docs:
#    enabled: false    # Kills the Gateway's native empty spec
  #  use-management-port: true # Forces Swagger UI to run only on 8082
  swagger-ui:
    path: /swagger-ui.html
    # Instructs the UI on 8082 to pull the JSON through the proxy on 8080
    urls:
      - name: wallet-service
        url: /wallet-service/v3/api-docs

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
  rate-limit:
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}

resilience4j:
  circuitbreaker:
    instances:
      walletServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5

  timelimiter:
    instances:
      walletServiceCircuitBreaker:
        timeoutDuration: 5s

server:
  port: ${SERVER_PORT:8080}
