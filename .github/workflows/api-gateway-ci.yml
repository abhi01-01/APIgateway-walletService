name: API Gateway Edge CI/CD

# Trigger the pipeline only on pushes to the production branch
on:
  push:
    branches:
      - production

# Define environment variables used across stages
env:
  DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: wallet-api-gateway
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/wallet-api-gateway
  GATEWAY_WORKDIR: .
  # Forces all actions to execute on the Node 24 runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build & Unit Tests
        working-directory: ${{ env.GATEWAY_WORKDIR }}
        run: mvn clean package -DskipTests # Assuming tests run in a separate step or are currently bypassed for edge packaging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Executes the Multi-Stage Distroless Dockerfile we wrote in Phase 2
      - name: Build and Push Distroless Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.GATEWAY_WORKDIR }}
          file: ${{ env.GATEWAY_WORKDIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

          # Continuous Deployment (Trigger Target)
      # Notifies the server to pull the new 'latest' image and restart
      - name: Trigger Production Deployment
        run: |
          curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}    
